[project]
name = "gdq-cli"
version="1.1"
requires-python = ">=3.11"
dependencies = [
    "pubnub",
    "requests",
    "xdg",
]

[project.scripts]
gdq = "gdq.__main__:main"
bus = "bus.__main__:main"

[tool.mypy]
python_version = 3.12
strict = true
exclude = "(build|tests)"

[[tool.mypy.overrides]]
module = [
    "pubnub.*",
    "xdg"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
fix = true
line-length = 120
builtins = ["__"]
target-version = "py312"

[tool.ruff.lint]
ignore = ["ANN", "D", "T201"]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bus = ["*.json"]
